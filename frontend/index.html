<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        height: 100%;
        background-color: #f1f5f2;

        overflow-x: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        background-color: #f1f5f2;
      }
      /* Custom scrollbars for clean desktop experience */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #e7eee9;
      }
      ::-webkit-scrollbar-thumb {
        background: #a3c2ab;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6c9e78;
      }
